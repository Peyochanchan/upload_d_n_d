name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Lint code for consistent style
        run: bin/rubocop -f github

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Audit dependencies for known CVEs
        run: bundle exec bundler-audit check --update

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Diagonale : chaque Ruby avec un Rails de la plage supportée
          - { ruby: "3.2", gemfile: "gemfiles/rails_7.2.gemfile" }
          - { ruby: "3.3", gemfile: "gemfiles/rails_8.0.gemfile" }
          - { ruby: "3.4", gemfile: "gemfiles/rails_8.1.gemfile" }
          # Croisé plancher/plafond : Ruby récent sur le plus vieux Rails
          - { ruby: "3.4", gemfile: "gemfiles/rails_7.2.gemfile" }

    name: test (ruby ${{ matrix.ruby }}, ${{ matrix.gemfile }})

    # Base jetable, propre au job : ces identifiants ne sont pas des secrets.
    # Gitea (act_runner) : le job tourne en conteneur, le service est joint par son nom.
    # GitHub : le job tourne sur la VM, le service est joint via un port publié sur l'hôte.
    services:
      postgres:
        image: postgres:16
        # Port hôte aléatoire : pas de conflit entre jobs parallèles sur un même runner.
        ports:
          - 5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      # Sur Gitea, l'hôte n'est pas localhost : levée du garde-fou de DatabaseCleaner,
      # la base est celle du service ci-dessus.
      DATABASE_CLEANER_ALLOW_REMOTE_DATABASE_URL: "true"

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Configure database URL
        env:
          SERVICE_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          if [ "$GITEA_ACTIONS" = "true" ]; then
            address="postgres:5432"
          else
            address="localhost:$SERVICE_PORT"
          fi
          echo "DATABASE_URL=postgres://postgres:postgres@$address/upload_d_n_d_test" >> "$GITHUB_ENV"

      - name: Prepare database
        run: bin/rails app:db:prepare

      - name: Run specs
        run: bundle exec rspec
