name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.7
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    # Base jetable, propre au job : ces identifiants ne sont pas des secrets.
    # Le job tourne en conteneur (act_runner) : le service est joint par son nom.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/upload_d_n_d_test
      # L'hôte n'est pas localhost : levée du garde-fou de DatabaseCleaner,
      # la base est celle du service ci-dessus.
      DATABASE_CLEANER_ALLOW_REMOTE_DATABASE_URL: "true"

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.7
          bundler-cache: true

      - name: Prepare database
        run: bin/rails app:db:prepare

      - name: Run specs
        run: bundle exec rspec
